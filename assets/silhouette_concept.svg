<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img">
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #24292f; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 15px; fill: #57606a; }
    .axis { stroke: #8c959f; stroke-width: 2; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    .line { fill: none; stroke: #2f80ed; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke: #27ae60; stroke-width: 3; stroke-dasharray: 9 9; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; rx: 8; }
    .blue { fill: #2f80ed; }
    .orange { fill: #f2994a; }
    .green { fill: #27ae60; }
    .red { fill: #eb5757; }
    .muted { fill: #8c959f; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <text x="490" y="48" text-anchor="middle" class="title">Silhouette Score Intuition</text>
  <ellipse cx="300" cy="285" rx="150" ry="95" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2" />
  <ellipse cx="690" cy="285" rx="150" ry="95" fill="#fff3e6" stroke="#f2994a" stroke-width="2" />
  <text x="300" y="155" text-anchor="middle" class="label">Cluster A</text><text x="690" y="155" text-anchor="middle" class="label">Cluster B</text>
  <circle cx="245" cy="265" r="7" class="blue" /><circle cx="285" cy="320" r="7" class="blue" /><circle cx="330" cy="260" r="7" class="blue" /><circle cx="355" cy="310" r="7" class="blue" /><circle cx="275" cy="235" r="7" class="blue" /><circle cx="640" cy="270" r="7" class="orange" /><circle cx="690" cy="235" r="7" class="orange" /><circle cx="730" cy="305" r="7" class="orange" /><circle cx="665" cy="325" r="7" class="orange" /><circle cx="745" cy="255" r="7" class="orange" /><circle cx="450" cy="290" r="9" class="green" /><text x="450" y="260" text-anchor="middle" class="label">point</text><text x="375" y="398" text-anchor="middle" class="small">a: close to own cluster</text><text x="595" y="398" text-anchor="middle" class="small">b: far from nearest other cluster</text>
</svg>
